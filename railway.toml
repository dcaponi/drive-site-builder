[deploy]
# BODY_SIZE_LIMIT lifts adapter-node's 512K request-body cap so the file
# upload API can accept ~30 MB zips (sent as base64 JSON). A BODY_SIZE_LIMIT
# env var set on the service still wins over the 45M default.
startCommand = "BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-45M} node build/index.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
